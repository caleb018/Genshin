name: Build Minecraft Mod

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java 25 / Gradle 9.3.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          # O projeto Gradle fica dentro de mod/, não na raiz do repositório.
          cache-dependency-path: mod/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compile and run tests
        working-directory: mod
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genshin-elements-${{ github.sha }}
          path: mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

name: Build Genshin Elements

on:
  push:
    branches: [main]
    paths:
      - "genshin-elements-mod (1).zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mod ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="genshin-elements-mod (1).zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Não encontrei $ZIP_FILE na raiz do repositório."
            exit 1
          }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ -f extracted/mod/build.gradle ]; then
            PROJECT_DIR="extracted/mod"
          elif [ -f extracted/build.gradle ]; then
            PROJECT_DIR="extracted"
          else
            echo "::error::O ZIP não contém build.gradle na raiz nem em mod/."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Gradle encontrado em: $PROJECT_DIR"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
          gradle-home-cache-cleanup: true

      - name: Compile and build mod
        shell: bash
        run: gradle --no-daemon --stacktrace build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genshin-elements-build
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error

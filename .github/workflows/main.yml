name: Build Genshin Elements

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project ZIP
        run: |
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz do repositorio."
            exit 1
          fi
          mkdir -p extracted
          for archive in "${archives[@]}"; do
            unzip -q "$archive" -d extracted
          done

      - name: Find Gradle project
        id: project
        run: |
          build_file="$(find extracted -type f -name build.gradle -print -quit)"
          if [ -z "$build_file" ]; then
            echo "Nao encontrei build.gradle dentro do ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          project_dir="$(dirname "$build_file")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $project_dir"

      - name: Compile mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genshin-elements-${{ github.sha }}
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          

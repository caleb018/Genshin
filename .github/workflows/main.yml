name: Build Genshin Elements Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build with Gradle
        run: |
          if [ -d "mod" ] && [ -f "mod/build.gradle" ]; then
            echo "Arquivos encontrados na pasta 'mod'"
            cd mod
          elif [ -d "genshin-elements" ] && [ -f "genshin-elements/build.gradle" ]; then
            echo "Arquivos encontrados na pasta 'genshin-elements'"
            cd genshin-elements
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          else
            chmod +x gradlew
          fi
          ./gradlew build --stacktrace

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-elements-mod-jar
          path: |
            build/libs/*.jar
            **/build/libs/*.jar

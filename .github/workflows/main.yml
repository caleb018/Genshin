
name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract mod project
        run: |
          unzip -q genshin-elements-mod.zip -d extracted
          test -f extracted/mod/build.gradle
          test -f extracted/mod/gradle.properties

      - name: Build with Gradle
        working-directory: extracted/mod
        run: gradle build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinElementsMod-Build
          path: extracted/mod/build/libs/*.jar
          if-no-files-found: error
